<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Statement Analyzer</title>
    <!-- Tailwind CSS for Professional UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8 font-sans">
    <div class="max-w-5xl mx-auto">
        <!-- Upload Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-800">Financial Analyzer</h1>
            <p class="text-slate-500 mt-2">Upload Bank Statement for Instant Review</p>
            
            <div class="mt-8 flex flex-col items-center justify-center">
                <input type="file" id="pdfFile" class="block w-full max-w-md text-sm text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition" accept=".pdf" />
            </div>
            
            <button id="analyzeBtn" onclick="uploadFile()" class="mt-6 w-full max-w-md bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl transition duration-300 shadow-md">
                Generate Report
            </button>
            <p id="loadingText" class="text-blue-600 font-semibold mt-4 hidden animate-pulse">Processing Statement... Please wait ⏳</p>
        </div>

        <!-- Professional Dashboard (Hidden by default) -->
        <div id="dashboard" class="hidden">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-2">Financial Report</h2>
            
            <!-- Metric Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 border-l-4 border-l-green-500">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Total Credits</h3>
                    <p id="totalCredits" class="text-2xl font-black text-slate-800 mt-2">₹0</p>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 border-l-4 border-l-red-500">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Total Debits</h3>
                    <p id="totalDebits" class="text-2xl font-black text-slate-800 mt-2">₹0</p>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 border-l-4 border-l-blue-500">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Active Loans Count</h3>
                    <p id="activeLoans" class="text-2xl font-black text-slate-800 mt-2">0</p>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 border-l-4 border-l-purple-500">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">EMI Transactions Count</h3>
                    <p id="emiCount" class="text-2xl font-black text-slate-800 mt-2">0</p>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 border-l-4 border-l-orange-500">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Bounces & Late Fees</h3>
                    <p id="bounces" class="text-2xl font-black text-slate-800 mt-2">0</p>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 border-l-4 border-l-indigo-500">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Health Score</h3>
                    <p id="healthScore" class="text-2xl font-black text-slate-800 mt-2">0/10</p>
                </div>

            </div>

            <!-- Summary Section -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 border-l-4 border-l-slate-800">
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Executive Summary</h3>
                <p id="summaryText" class="text-slate-700 mt-3 font-medium leading-relaxed"></p>
            </div>
        </div>
        
        <!-- Error Box -->
        <div id="errorBox" class="hidden mt-6 bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-sm">
            <span id="errorText" class="block font-medium"></span>
        </div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('pdfFile');
            const btn = document.getElementById('analyzeBtn');
            const loadingText = document.getElementById('loadingText');
            const dashboard = document.getElementById('dashboard');
            const errorBox = document.getElementById('errorBox');
            
            if (fileInput.files.length === 0) {
                alert("Please select a statement first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            btn.classList.add('hidden');
            loadingText.classList.remove('hidden');
            dashboard.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                // Call Backend
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.status === 200) {
                    try {
                        // Parse strict JSON from backend
                        const data = JSON.parse(result.ai_summary);
                        
                        document.getElementById('totalCredits').innerText = data.total_credits;
                        document.getElementById('totalDebits').innerText = data.total_debits;
                        document.getElementById('activeLoans').innerText = data.active_loans_count;
                        document.getElementById('emiCount').innerText = data.emi_transactions_count;
                        document.getElementById('bounces').innerText = data.bounces_and_late_fees;
                        document.getElementById('healthScore').innerText = data.health_score;
                        document.getElementById('summaryText').innerText = data.summary;
                        
                        dashboard.classList.remove('hidden');
                    } catch (e) {
                        document.getElementById('errorText').innerText = "Data parsing error. Ensure the document is a valid statement.";
                        errorBox.classList.remove('hidden');
                    }
                } else {
                    document.getElementById('errorText').innerText = result.message || result.error;
                    errorBox.classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('errorText').innerText = "Server connection failed. Please try again.";
                errorBox.classList.remove('hidden');
            } finally {
                btn.classList.remove('hidden');
                loadingText.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
